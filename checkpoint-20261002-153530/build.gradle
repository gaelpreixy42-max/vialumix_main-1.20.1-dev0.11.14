plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Sodium/Iris are supplied locally in instance/mods because their Modrinth Maven coordinates
    // are not published under maven.modrinth for these exact 1.20.1 versions.
    modCompileOnly files(
        'instance/mods/sodium-0.5.13+mc1.20.1.jar',
        'instance/mods/iris-1.7.6+mc1.20.1.jar'
    )
    // Optional compile-time API for Mod Menu 7.2.2 on Minecraft 1.20.1.
    // It is not a runtime dependency of Vialumix.
    modCompileOnly 'maven.modrinth:mOgUt4GM:lEkperf6'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('LICENSE') { rename { "${it}_vialumix" } }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
}
