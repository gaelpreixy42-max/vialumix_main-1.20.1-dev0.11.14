plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Sodium/Iris are supplied locally in instance/mods because their Modrinth Maven coordinates
    // are not published under maven.modrinth for these exact 1.20.1 versions.
    modCompileOnly files(
        'instance/mods/sodium-0.5.13+mc1.20.1.jar',
        'instance/mods/iris-1.7.6+mc1.20.1.jar'
    )
    // Iris bundles these (jar-in-jar); the dev runtime needs them on the classpath explicitly.
    runtimeOnly fileTree(dir: "libs/devruntime", include: ["*.jar"])
    // Dev-only runtime so runClient exercises the real Sodium + Iris pipeline (used by the automated render test).
    modLocalRuntime files(
        'instance/mods/sodium-0.5.13+mc1.20.1.jar',
        'instance/mods/iris-1.7.6+mc1.20.1.jar'
    )
    // Optional compile-time API for Mod Menu 7.2.2 on Minecraft 1.20.1.
    // It is not a runtime dependency of Vialumix.
    modCompileOnly 'maven.modrinth:mOgUt4GM:lEkperf6'
}

processResources {
    inputs.property 'version', project.version
    // The Radiance/MCVR renderer is a standalone Vulkan renderer and cannot be
    // loaded alongside Sodium's OpenGL context hooks in this profile.
    exclude 'Radiance-0.1.6-alpha-fabric-1.20.1-windows.jar'
    exclude 'fabric.mcvr.json'
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

// A separate profile artifact for validating MCVR before attempting any Iris shaderpack integration.
// It explicitly excludes Sodium and Iris because the full Radiance Vulkan renderer is not a drop-in
// post-processing pass for their OpenGL pipeline.
tasks.register('mcvrJar', Jar) {
    dependsOn tasks.named('remapJar')
    archiveClassifier = 'mcvr'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.named('remapJar').get().archiveFile.get().asFile) }) {
        exclude 'fabric.mod.json'
        exclude 'fabric.mcvr.json'
        exclude 'Radiance-0.1.6-alpha-fabric-1.20.1-windows.jar'
    }
    from('src/main/resources/fabric.mcvr.json') {
        rename { 'fabric.mod.json' }
        filter { line -> line.replace('${version}', project.version.toString()) }
    }
    from('mcvr/Radiance-0.1.6-alpha-fabric-1.20.1-windows.jar')
    from('LICENSE') { rename { "${it}_vialumix" } }
    from('mcvr/LICENSE.md') { rename { 'LICENSE_MCVR' } }
}

tasks.named('assemble') {
    dependsOn tasks.named('mcvrJar')
}

// Keep a fresh remapped input path; Loom's previous output may still be open in another process.
tasks.named('remapJar') {
    archiveClassifier = 'remap'
}
tasks.named('remapSourcesJar') {
    archiveClassifier = 'remap-sources'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    exclude 'Radiance-0.1.6-alpha-fabric-1.20.1-windows.jar'
    exclude 'fabric.mcvr.json'
    from('LICENSE') { rename { "${it}_vialumix" } }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
}
